[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "1.0.0"
description = "Production-shaped football analytics platform for event data, xG, xT and scouting workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Mischa Herzog"}]
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "networkx>=3.3,<4",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1"
]

[project.scripts]
football-analytics = "football_analytics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
